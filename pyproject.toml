[project]
name = "inreach-proxy"
version = "0.1.0"
description = "Proxy layer to support RPC type requests from a Garmin InReach"
authors = [
    { name = "Damian Zaremba", email = "damian@damianzaremba.co.uk" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django (>=6.1.3,<7.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "pyaml (>=26.7.0,<27.0.0)",
    "defusedxml (>=0.7.1,<0.8.0)",
    "numpy (>=2.5.4,<3.0.0)",
]

[tool.poetry.group.test.dependencies]
tox = "4.52.0"
tox-current-env = "0.0.16"
black = "26.10.1"
ruff = "0.15.9"
djlint = "1.36.4"
bandit = "1.9.4"
requests_mock = "1.12.1"

[tool.ruff]
exclude = ['*/migrations/*', 've/*', '.tox/*']
line-length = 120

[tool.djlint]
profile = 'django'
use_gitignore = true
max_attribute_length = 120

[tool.black]
line-length = 120
extend-exclude = '''
(
  ^/ve
  |
  ^.*/migrations/.*
)
'''

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"